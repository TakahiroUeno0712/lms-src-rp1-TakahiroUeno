<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{/common/layout :: layout(~{::title},~{::body/content()})}">

<head>
	<meta charset="UTF-8">
	<title>勤怠情報変更｜LMS</title>
</head>

<body>

	<th:block th:if="${session.loginUserDto.role == '0001'}">
		<h2>勤怠管理</h2>
	</th:block>

	<th:block th:if="${session.loginUserDto.role != '0001'}">
		<h2>勤怠管理 <small>( [[${attendanceForm.userName}]] )</small></h2>
		<th:block th:if="${session.loginUserDto.leaveFlg == '1'}">
			<h2><small>途中退校日：${dispLeaveDate}</small></h2>
		</th:block>
	</th:block>

	<!-- Task.27 - 上野貴博 -->
	<!-- 入力チェックエラーメッセージ表示 -->
	<div th:if="${errors != null}" class="error">
		<ul>
			<li th:each="error : ${errors}" th:text="${#messages.msgWithParams(error.code, error.arguments)}"></li>
		</ul>
	</div>

	<div class="row">
		<div class="bs-component col-sm-12">

			<form th:action="@{/attendance/update}" method="post">
				<table class="table table-hover dataTable no-footer">
					<thead>
						<tr>
							<th class="w140">日付</th>
							<th class="w140">コース内容</th>
							<th class="w180">出勤</th>
							<th class="w180">退勤</th>
							<th class="w80">中抜け時間</th>
							<th class="w70">ステータス</th>
							<th class="w140">備考</th>
						</tr>
					</thead>
					<tbody>
						<th:block th:each="dailyAttendanceForm, stat : *{attendanceForm.attendanceList}">
							<tr>
								<th:block>
									<input type="hidden" th:name="|attendanceList[${stat.index}].isToday|"
										th:value="${dailyAttendanceForm.isToday}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].studentAttendanceId|"
										th:value="${dailyAttendanceForm.studentAttendanceId}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].trainingDate|"
										th:value="${dailyAttendanceForm.trainingDate}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].dispTrainingDate|"
										th:value="${dailyAttendanceForm.dispTrainingDate}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].sectionName|"
										th:value="${dailyAttendanceForm.sectionName}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].statusDispName|"
										th:value="${dailyAttendanceForm.statusDispName}" />
								</th:block>
								<td class="w140">[[${dailyAttendanceForm.dispTrainingDate}]]</td>
								<td class="w140">[[${dailyAttendanceForm.sectionName}]]</td>
								<td class="w70">

									<!-- 上野貴博 - Task.26 -->
									<!-- 出勤時刻を「時」「分」に分割しプルダウンへ変更 -->
									<div style="display: flex; justify-content: space-between;">

										<!-- 出勤時間(時)
											th:field:attendanceListの現在行のtrainingStartTimeHourと紐づけ
											th:each:hourMapからプルダウンの選択肢を生成 -->
										<select name class="form-control time-control"
											errorstyleclass="form-control errorInput" property="trainingStartTimeHour"
											indexed="true"
											th:field="*{attendanceForm.attendanceList[__${stat.index}__].trainingStartTimeHour}">
											<option th:each="hour: *{attendanceForm.hourMap}" th:value="*{hour.key}"
												th:text="*{hour.value}"></option>
										</select>

										<span>:</span>

										<!-- 出勤時間(分)
											th:field:attendanceListの現在行のtrainingStartTimeMinuteと紐づけ
											th:each:minuteMapからプルダウンの選択肢を生成 -->
										<select name class="form-control time-control"
											errorstyleclass="form-control errorInput" property="trainingStartTimeMinute"
											indexed="true"
											th:field="*{attendanceForm.attendanceList[__${stat.index}__].trainingStartTimeMinute}">
											<option th:each="minute: *{attendanceForm.minuteMap}"
												th:value="*{minute.key}" th:text="*{minute.value}"></option>
										</select>
									</div>

								</td>
								<td class="w70">

									<!-- 上野貴博 - Task.26 -->
									<!-- 退勤時刻を「時」「分」に分割しプルダウンへ変更 -->
									<div style="display: flex; justify-content: space-between;">

										<!-- 退勤時間(時)
											th:field:attendanceListの現在行のtrainingEndTimeHourと紐づけ
											th:each:hourMapからプルダウンの選択肢を生成 -->
										<select name class="form-control time-control"
											errorstyleclass="form-control errorInput" property="trainingEndTimeHour"
											indexed="true"
											th:field="*{attendanceForm.attendanceList[__${stat.index}__].trainingEndTimeHour}">
											<option th:each="hour: *{attendanceForm.hourMap}" th:value="*{hour.key}"
												th:text="*{hour.value}"></option>
										</select>

										<span>:</span>

										<!-- 出勤時間(分)
											th:field:attendanceListの現在行のtrainingEndTimeMinuteと紐づけ
											th:each:minuteMapからプルダウンの選択肢を生成 -->
										<select name class="form-control time-control"
											errorstyleclass="form-control errorInput" property="trainingEndTimeMinute"
											indexed="true"
											th:field="*{attendanceForm.attendanceList[__${stat.index}__].trainingEndTimeMinute}">
											<option th:each="minute: *{attendanceForm.minuteMap}"
												th:value="*{minute.key}" th:text="*{minute.value}"></option>
										</select>
									</div>

								</td>
								<td class="w80">
									<select th:name="|attendanceList[${stat.index}].blankTime|" class="form-control">
										<option th:each="blankTime : ${attendanceForm.blankTimes}"
											th:value="${blankTime.key}" th:inlne="text" class="form-control"
											th:selected="${blankTime.key == dailyAttendanceForm.blankTime}">
											[[${blankTime.value}]]</option>
									</select>
								</td>
								<td class="w70">[[${dailyAttendanceForm.statusDispName}]]</td>
								<td class="w140">
									<input type="text" th:name="|attendanceList[${stat.index}].note|"
										th:value="${dailyAttendanceForm.note}" class="form-control"></input>
								</td>
							</tr>
						</th:block>
					</tbody>
				</table>

				<div class="form-group">
					<th:block th:if="${session.loginUserDto.role == '0001'}">
						<a th:href="@{/attendance/detail}" class="btn btn-default">戻る</a>
					</th:block>
					<th:block th:if="${session.loginUserDto.role != '0001'}">
						<input type="submit" value="戻る" name="indexCompany" class="btn btn-default" />
					</th:block>
					<input type="submit" value="更新" name="complete" class="btn btn-info"
						onClick="return confirm('更新します。よろしいですか？')">
				</div>
			</form>
		</div>
	</div>

</body>

</html>
